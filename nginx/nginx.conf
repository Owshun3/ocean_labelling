events { worker_connections 512; }

http {
  server {
    listen 8080;
    server_tokens off;

    # ── API applicative interne (RBAC) ────────────────────────────────────
    location /app-api/ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $http_origin;
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Length' 0;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' $http_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      proxy_pass http://app-api:3000/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }

    # ── CVAT API ──────────────────────────────────────────────────────────
    location /api/ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $http_origin;
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-CSRFToken';
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Length' 0;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' $http_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-CSRFToken' always;
      proxy_pass http://cvat_server:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
      client_max_body_size 1G;
    }

    # ── Fichiers statiques et admin Django ───────────────────────────────
    location /static/ {
      proxy_pass http://cvat_server:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }

    # ── Studio d'annotation CVAT ─────────────────────────────────────────
    # - Header CVAT masqué (CSS)
    # - Navigation SPA bloquée hors /tasks/*/jobs/* (JS)
    # - Bouton "Valider et terminer" injecté (JS)
    # Doit être AVANT le bloc de blocage (regex évalués dans l'ordre)
    location ~ ^/tasks/[0-9]+/jobs/[0-9]+ {
      # Désactiver la compression pour que sub_filter puisse modifier le HTML
      proxy_set_header Accept-Encoding "";

      sub_filter '<head>' '<head>
<style>
  [class*="cvat-header"] { display: none !important; }
  header.ant-layout-header { display: none !important; }
  #ocean-val-btn:hover { background: #059669 !important; }
</style>
<script>
(function () {
  /* --- Extraction des IDs depuis l URL --- */
  var m = location.pathname.match(/\/tasks\/([0-9]+)\/jobs\/([0-9]+)/);
  if (!m) return;
  var jobId = m[2];

  /* --- Parametre de retour encode par notre app --- */
  var ret = new URLSearchParams(location.search).get("appReturn");

  /* --- CSRF cookie (session CVAT deja active) --- */
  function csrf() {
    var c = document.cookie.match(/csrftoken=([^;]+)/);
    return c ? c[1] : "";
  }

  /* --- Bouton de validation --- */
  function addBtn() {
    if (document.getElementById("ocean-val-btn")) return;
    var btn = document.createElement("button");
    btn.id = "ocean-val-btn";
    btn.textContent = "Valider et terminer";
    btn.style.cssText = [
      "position:fixed", "bottom:24px", "right:24px", "z-index:9999",
      "background:#10b981", "color:#fff", "border:none", "border-radius:8px",
      "padding:12px 24px", "font-size:14px", "font-weight:600", "cursor:pointer",
      "box-shadow:0 4px 16px rgba(0,0,0,.25)", "transition:background .15s"
    ].join(";");

    btn.onclick = async function () {
      btn.disabled = true;
      btn.textContent = "Sauvegarde...";
      btn.style.background = "#6b7280";

      /* 1. Declencher la sauvegarde CVAT (Ctrl+S) */
      window.dispatchEvent(new KeyboardEvent("keydown", {
        key: "s", code: "KeyS", ctrlKey: true, bubbles: true
      }));

      /* 2. Laisser CVAT sauvegarder (2s) */
      await new Promise(function (r) { setTimeout(r, 2000); });

      /* 3. Marquer le job "completed" via API CVAT */
      try {
        await fetch("/api/jobs/" + jobId, {
          method: "PATCH",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/vnd.cvat+json",
            "X-CSRFToken": csrf()
          },
          body: JSON.stringify({ state: "completed" })
        });
      } catch (e) {
        console.warn("[ocean] job state update failed:", e);
      }

      /* 4. Retour a notre application */
      btn.textContent = "Termine !";
      btn.style.background = "#10b981";
      await new Promise(function (r) { setTimeout(r, 700); });
      if (ret) {
        window.location.href = decodeURIComponent(ret);
      } else {
        window.close();
      }
    };

    document.body.appendChild(btn);
  }

  /* --- Bloquer la navigation SPA hors du studio --- */
  var pat = /^\/tasks\/[0-9]+\/jobs\/[0-9]+/;
  var _p = history.pushState.bind(history);
  var _r = history.replaceState.bind(history);
  history.pushState    = function (s, t, u) { if (!u || pat.test(String(u))) _p(s, t, u); };
  history.replaceState = function (s, t, u) { if (!u || pat.test(String(u))) _r(s, t, u); };

  /* --- Attendre que CVAT soit rendu (canvas visible) --- */
  var obs = new MutationObserver(function () {
    if (document.querySelector(".cvat-canvas-container") ||
        document.querySelector("[class*=cvat-canvas]")) {
      addBtn();
      obs.disconnect();
    }
  });
  if (document.body) {
    obs.observe(document.body, { childList: true, subtree: true });
  } else {
    document.addEventListener("DOMContentLoaded", function () {
      obs.observe(document.body, { childList: true, subtree: true });
    });
  }
  /* Fallback si le canvas n est pas detecte dans les 8s */
  setTimeout(addBtn, 8000);
})();
</script>';
      sub_filter_once on;
      sub_filter_types text/html;

      proxy_pass http://cvat_ui:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }

    # ── Blocage des pages de gestion CVAT ─────────────────────────────────
    # Redirige vers une page d'erreur si l'utilisateur tente d'accéder
    # directement à la liste des tâches, projets, etc.
    location ~ ^/(tasks|projects|jobs|organizations|analytics|cloudstorages|settings|models|webhooks|guide)(/.*)?$ {
      default_type text/html;
      return 403 '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Acc\xC3\xA8s refus\xC3\xA9</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:#fff;border-radius:8px;padding:2rem 2.5rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.1);max-width:400px}h2{color:#1e293b;margin-bottom:.75rem}p{color:#64748b;margin-bottom:1.5rem;line-height:1.5}button{background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:.6rem 1.5rem;font-size:1rem;cursor:pointer}button:hover{background:#2563eb}</style></head><body><div class="card"><h2>Acc\xC3\xA8s refus\xC3\xA9</h2><p>Cette section n\xE2\x80\x99est pas accessible depuis l\xE2\x80\x99application. Fermez cet onglet et revenez \xC3\xA0 l\xE2\x80\x99application.</p><button onclick="window.close()">Fermer cet onglet</button></div></body></html>';
    }

    # ── SPA CVAT (page d'accueil, assets, WebSocket) ─────────────────────
    location / {
      proxy_pass http://cvat_ui:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }
  }
}

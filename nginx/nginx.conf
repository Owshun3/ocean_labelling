events { worker_connections 512; }

http {
  server {
    listen 8080;
    server_tokens off;

    # ── Fichiers statiques Ocean (JS/CSS injectés dans le studio CVAT) ───────
    location /ocean-static/ {
      alias /etc/nginx/ocean-static/;
      add_header Cache-Control "no-store";
    }

    # ── API applicative interne (RBAC) ────────────────────────────────────
    location /app-api/ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $http_origin;
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Length' 0;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' $http_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      proxy_pass http://app-api:3000/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }

    # ── CVAT API ──────────────────────────────────────────────────────────
    location /api/ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $http_origin;
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-CSRFToken';
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Length' 0;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' $http_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-CSRFToken' always;
      proxy_pass http://cvat_server:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
      client_max_body_size 1G;
    }

    # ── Fichiers statiques et admin Django ───────────────────────────────
    location /static/ {
      proxy_pass http://cvat_server:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }

    # ── Studio d'annotation CVAT ─────────────────────────────────────────
    # Injecte ocean-studio.css + ocean-studio.js depuis /ocean-static/.
    # Doit etre AVANT le bloc de blocage (regex evalues dans l'ordre).
    location ~ ^/tasks/[0-9]+/jobs/[0-9]+ {
      proxy_set_header Accept-Encoding "";

      sub_filter '<head>' '<head><link rel="stylesheet" href="/ocean-static/ocean-studio.css"><script defer src="/ocean-static/ocean-studio.js"></script>';
      sub_filter_once on;
      sub_filter_types text/html;

      proxy_pass http://cvat_ui:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }

    # ── Blocage des pages de gestion CVAT ─────────────────────────────────
    location ~ ^/(tasks|projects|jobs|organizations|analytics|cloudstorages|settings|models|webhooks|guide)(/.*)?$ {
      default_type text/html;
      return 403 '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Acc\xC3\xA8s refus\xC3\xA9</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:#fff;border-radius:8px;padding:2rem 2.5rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.1);max-width:400px}h2{color:#1e293b;margin-bottom:.75rem}p{color:#64748b;margin-bottom:1.5rem;line-height:1.5}button{background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:.6rem 1.5rem;font-size:1rem;cursor:pointer}button:hover{background:#2563eb}</style></head><body><div class="card"><h2>Acc\xC3\xA8s refus\xC3\xA9</h2><p>Cette section n\xE2\x80\x99est pas accessible depuis l\xE2\x80\x99application. Fermez cet onglet et revenez \xC3\xA0 l\xE2\x80\x99application.</p><button onclick="window.close()">Fermer cet onglet</button></div></body></html>';
    }

    # ── SPA CVAT (page d'accueil, assets, WebSocket) ─────────────────────
    location / {
      proxy_pass http://cvat_ui:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_redirect off;
    }
  }
}

name: cvat

include:
  - path:
      - cvat-core/docker-compose.yml
      - cvat-core/docker-compose.override.yml

services:
  cvat_server:
    environment:
      DJANGO_SETTINGS_MODULE: 'cvat.settings.ocean'
      CSRF_TRUSTED_ORIGINS: 'http://localhost:8081,http://127.0.0.1:8081,http://localhost:8888,http://127.0.0.1:8888'
    volumes:
      - ./cvat-extras/ocean.py:/home/django/cvat/settings/ocean.py:ro

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ocean_labelling
      POSTGRES_USER: ocean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Créer un fichier .env avec POSTGRES_PASSWORD (voir .env.example)}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocean -d ocean_labelling"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-api:
    build: ./app-api
    environment:
      - CVAT_API_URL=http://cvat_server:8080/api
      - DATABASE_URL=postgres://ocean:${POSTGRES_PASSWORD}@postgres:5432/ocean_labelling
      - CVAT_ADMIN_USER=${CVAT_ADMIN_USER:-admin}
      - CVAT_ADMIN_PASS=${CVAT_ADMIN_PASS:?Créer un fichier .env avec CVAT_ADMIN_PASS (voir .env.example)}
    networks:
      - default
      - cvat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cvat_server:
        condition: service_started

  gateway:
    image: nginx:alpine
    ports:
      - "8888:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/etc/nginx/ocean-static:ro
    networks:
      - default
      - cvat
    restart: unless-stopped
    depends_on:
      - app-api

volumes:
  pg_data:

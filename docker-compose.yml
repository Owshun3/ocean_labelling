name: cvat

# CVAT's docker-compose.override.yml est dans son .gitignore (vocation locale-dev),
# on ne peut donc pas le tracker. On l'évite : son contenu (CORS + ALLOWED_HOSTS
# + port 8000) est inliné directement dans la section cvat_server ci-dessous.
include:
  - path:
      - cvat-core/docker-compose.yml

services:
  cvat_server:
    ports:
      # Accès CVAT direct exposé sur 8000 — utile en dev. En prod, le firewall
      # doit fermer ce port (tout passe par le gateway sur 8888/443).
      - "8000:8080"
    environment:
      DJANGO_SETTINGS_MODULE: 'cvat.settings.ocean'
      CORS_ALLOW_ALL_ORIGINS: 'True'
      ALLOWED_HOSTS: '*'
      # OCEAN_HTTPS=1 active SESSION_COOKIE_SECURE / CSRF_COOKIE_SECURE /
      # SECURE_PROXY_SSL_HEADER cote Django CVAT (cf. cvat-extras/ocean.py).
      # A definir dans .env quand le gateway termine TLS ; laisser vide en HTTP.
      OCEAN_HTTPS: '${OCEAN_HTTPS:-}'
      # Origines acceptées par Django CSRF. Défaut localhost pour le dev local —
      # surchargée via .env sur la VM (ex : CSRF_TRUSTED_ORIGINS=https://<domaine>).
      CSRF_TRUSTED_ORIGINS: '${CSRF_TRUSTED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:8888,http://127.0.0.1:8888}'
    volumes:
      - ./cvat-extras/ocean.py:/home/django/cvat/settings/ocean.py:ro

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ocean_labelling
      POSTGRES_USER: ocean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Créer un fichier .env avec POSTGRES_PASSWORD (voir .env.example)}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocean -d ocean_labelling"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-api:
    build: ./app-api
    environment:
      - CVAT_API_URL=http://cvat_server:8080/api
      - DATABASE_URL=postgres://ocean:${POSTGRES_PASSWORD}@postgres:5432/ocean_labelling
      - CVAT_ADMIN_USER=${CVAT_ADMIN_USER:-admin}
      - CVAT_ADMIN_PASS=${CVAT_ADMIN_PASS:?Créer un fichier .env avec CVAT_ADMIN_PASS (voir .env.example)}
      - VIDEO_STORAGE_ROOT=/data/videos
      # Le Dockerfile app-api met NODE_ENV=production en dur. En production
      # HTTPS, c'est ce qu'on veut (flag Secure sur cookie ocean_session).
      # En phase de test HTTP (LAN UPF avant le cert Let's Encrypt), il faut
      # forcer NODE_ENV=development sinon le browser refuse le cookie Secure
      # cote HTTP et le login fonctionne sans la session.
      - NODE_ENV=${APP_API_NODE_ENV:-development}
    volumes:
      - ocean_videos:/data/videos
    networks:
      - default
      - cvat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cvat_server:
        condition: service_started

  gateway:
    image: nginx:alpine
    ports:
      - "8888:8080"   # fallback HTTP local (test rapide depuis VM)
      - "80:80"       # redirection HTTP -> HTTPS
      - "443:443"     # HTTPS production
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/etc/nginx/ocean-static:ro
      - ./nginx/certs:/etc/nginx/certs:ro                   # cert HTTPS (auto-signe ou LE)
      - ./frontend/dist:/usr/share/nginx/ocean-dist:ro      # bundle statique Expo Web
    networks:
      - default
      - cvat
    restart: unless-stopped
    depends_on:
      - app-api

volumes:
  pg_data:
  ocean_videos:

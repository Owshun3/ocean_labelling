name: cvat

# CVAT's docker-compose.override.yml est dans son .gitignore (vocation locale-dev),
# on ne peut donc pas le tracker. On l'évite : son contenu (CORS + ALLOWED_HOSTS
# + port 8000) est inliné directement dans la section cvat_server ci-dessous.
include:
  - path:
      - cvat-core/docker-compose.yml

services:
  cvat_server:
    ports:
      # Accès CVAT direct exposé sur 8000 — utile en dev. En prod, le firewall
      # doit fermer ce port (tout passe par le gateway sur 8888/443).
      - "8000:8080"
    environment:
      DJANGO_SETTINGS_MODULE: 'cvat.settings.ocean'
      CORS_ALLOW_ALL_ORIGINS: 'True'
      ALLOWED_HOSTS: '*'
      # Origines acceptées par Django CSRF. Défaut localhost pour le dev local —
      # surchargée via .env sur la VM (ex : CSRF_TRUSTED_ORIGINS=https://<domaine>).
      CSRF_TRUSTED_ORIGINS: '${CSRF_TRUSTED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:8888,http://127.0.0.1:8888}'
    volumes:
      - ./cvat-extras/ocean.py:/home/django/cvat/settings/ocean.py:ro

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ocean_labelling
      POSTGRES_USER: ocean
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Créer un fichier .env avec POSTGRES_PASSWORD (voir .env.example)}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocean -d ocean_labelling"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-api:
    build: ./app-api
    environment:
      - CVAT_API_URL=http://cvat_server:8080/api
      - DATABASE_URL=postgres://ocean:${POSTGRES_PASSWORD}@postgres:5432/ocean_labelling
      - CVAT_ADMIN_USER=${CVAT_ADMIN_USER:-admin}
      - CVAT_ADMIN_PASS=${CVAT_ADMIN_PASS:?Créer un fichier .env avec CVAT_ADMIN_PASS (voir .env.example)}
      - VIDEO_STORAGE_ROOT=/data/videos
    volumes:
      - ocean_videos:/data/videos
    networks:
      - default
      - cvat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cvat_server:
        condition: service_started

  gateway:
    image: nginx:alpine
    ports:
      - "8888:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/etc/nginx/ocean-static:ro
    networks:
      - default
      - cvat
    restart: unless-stopped
    depends_on:
      - app-api

volumes:
  pg_data:
  ocean_videos:
